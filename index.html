<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fit Tracker</title>
<meta name="description" content="Workout, food and progress tracker">
<meta name="theme-color" content="#16324f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fit Tracker">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header id="top">
  <div class="top-row">
    <div>
      <div id="top-title">Fit Tracker</div>
      <div id="top-sub"></div>
    </div>
    <div id="top-right"></div>
  </div>
  <div id="datebar" hidden>
    <button class="icon-btn" data-act="date-prev" aria-label="Previous day">&#8249;</button>
    <button id="date-label" data-act="date-pick"></button>
    <input type="date" id="date-input" aria-label="Pick a date">
    <button class="icon-btn" data-act="date-next" aria-label="Next day">&#8250;</button>
    <button class="chip-btn" data-act="date-today">Today</button>
  </div>
</header>

<main id="view"></main>

<nav id="tabs" hidden>
  <button data-tab="today"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/></svg><span>Today</span></button>
  <button data-tab="train"><svg viewBox="0 0 24 24"><path d="M3 10v4M6 7v10M18 7v10M21 10v4M6 12h12"/></svg><span>Train</span></button>
  <button data-tab="food"><svg viewBox="0 0 24 24"><path d="M6 3v8a3 3 0 0 0 6 0V3M9 3v18M17 3c-2 2-2 7 0 9v9"/></svg><span>Food</span></button>
  <button data-tab="progress"><svg viewBox="0 0 24 24"><path d="M4 20V4M4 20h16M7 15l4-4 3 3 5-7"/></svg><span>Progress</span></button>
  <button data-tab="more"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg><span>More</span></button>
</nav>

<div id="modal" hidden>
  <div id="modal-card" role="dialog" aria-modal="true">
    <div id="modal-body"></div>
  </div>
</div>
<div id="toast" hidden></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
